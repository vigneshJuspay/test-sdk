name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.7.0). Leave empty to derive from commit messages."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  lint:
    name: Lint Podspec
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Environment info
        run: |
          xcodebuild -version
          pod --version

      - name: Lint pod (dynamic framework)
        run: pod lib lint PeekKit.podspec --allow-warnings

      - name: Lint pod (static framework)
        run: pod lib lint PeekKit.podspec --allow-warnings --use-static-frameworks

  test:
    name: Build & Test Example App
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Environment info
        run: |
          xcodebuild -version
          pod --version

      - name: Install pods
        working-directory: Example
        run: pod install

      - name: Run unit tests
        working-directory: Example
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable and (.name | startswith("iPhone")))] | last | .name')
          if [ -z "$DEVICE" ] || [ "$DEVICE" = "null" ]; then
            echo "::error::No available iPhone simulator found on this runner"
            xcrun simctl list devices
            exit 1
          fi
          echo "Using simulator: $DEVICE"
          xcodebuild clean test \
            -workspace PeekKit.xcworkspace \
            -scheme PeekKit-Example \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Example/TestResults.xcresult

  release:
    name: Tag & Publish to CocoaPods
    needs: [lint, test]
    runs-on: macos-15
    timeout-minutes: 60
    environment: publish
    steps:
      - name: Guard branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/release" ]; then
            echo "::error::Releases can only run from the release branch (got $GITHUB_REF)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check there is something to release
        if: github.event_name == 'workflow_dispatch' && inputs.version == ''
        run: |
          LATEST_TAG=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$' | sort -V | tail -1 || true)
          if [ -z "$LATEST_TAG" ] || git tag --points-at HEAD | grep -qxF "$LATEST_TAG"; then
            exit 0
          fi
          if [ -z "$(git log --format=%s "$LATEST_TAG..HEAD" | grep -vE '^chore\(release\): .* \[skip ci\]$' || true)" ]; then
            echo "::error::Nothing to release: the only commits since $LATEST_TAG are CHANGELOG.md updates."
            exit 1
          fi

      - name: Determine version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'

          if [ -n "$VERSION_OVERRIDE" ]; then
            VERSION="$VERSION_OVERRIDE"
            echo "Using manual version override: $VERSION"
          else
            VERSION=$(git tag --points-at HEAD | grep -E "$SEMVER_RE" | sort -V | tail -1 || true)
            if [ -n "$VERSION" ]; then
              echo "Commit is already tagged as $VERSION, resuming that release"
            fi
          fi

          if [ -z "$VERSION" ]; then
            LATEST_TAG=$(git tag --list | grep -E "$SEMVER_RE" | sort -V | tail -1 || true)
            if [ -n "$LATEST_TAG" ]; then
              RANGE="$LATEST_TAG..HEAD"
            else
              RANGE="HEAD"
              LATEST_TAG="0.0.0"
            fi
            echo "Commits since $LATEST_TAG:"
            git log --pretty='%h %s' "$RANGE"

            # Max bump across all commits in the range; Jira prefixes (ABC-123: feat: ...) are stripped.
            SUBJECTS=$(git log --pretty=%s "$RANGE" | sed -E 's/^[A-Z]+-[0-9]+:[[:space:]]*//')
            BUMP='patch'
            if git log --pretty=%B "$RANGE" | grep -Eq '^[[:space:]]*BREAKING[- ]CHANGE'; then
              BUMP='major'
            elif echo "$SUBJECTS" | grep -Eq '^[a-z]+(\([^)]+\))?!:'; then
              BUMP='major'
            elif echo "$SUBJECTS" | grep -Eq '^feat(\([^)]+\))?:'; then
              BUMP='minor'
            fi
            echo "Bump: $BUMP"

            BASE=${LATEST_TAG%%-*}
            SUFFIX=${LATEST_TAG#"$BASE"}
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="$MAJOR.$MINOR.$PATCH$SUFFIX"
          fi

          if ! echo "$VERSION" | grep -Eq "$SEMVER_RE"; then
            echo "::error::Version '$VERSION' is not valid semver (expected e.g. 0.7.0)"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            if [ "$(git rev-parse "$VERSION^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag $VERSION already exists on a different commit"
              exit 1
            fi
            echo "Tag $VERSION already points at this commit, remaining steps resume idempotently"
          fi

          PREV_TAG=$(git tag --list | grep -E "$SEMVER_RE" | grep -vxF "$VERSION" | sort -V | tail -1 || true)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Import the Apple Distribution certificate
        id: cert
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12_BASE64" ]; then
            echo "::warning::APPLE_DIST_CERT_P12_BASE64 is not set, so the XCFramework is built and checked but not signed or uploaded; the SBOM still is."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          trap 'rm -f "$RUNNER_TEMP/certificate.p12"' EXIT
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERT_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the XCFramework
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.cert.outputs.signed }}
          IDENTITY: ${{ secrets.APPLE_DIST_IDENTITY }}
        run: |
          if [ "$SIGNED" = true ]; then
            if [ -z "$IDENTITY" ]; then
              echo "::error::APPLE_DIST_IDENTITY is not set; it names the certificate"
              exit 1
            fi
            export APPLE_DIST_IDENTITY="$IDENTITY"
          fi
          bash scripts/build-xcframework.sh "$VERSION"

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi

      - name: Generate the SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/sbom.sh "$VERSION" > build/xcframework/PeekKit.cdx.json

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
        run: |
          bash scripts/release-notes.sh "$PREV_TAG" "$VERSION" "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/release-notes.md"

      - name: Verify CocoaPods trunk authentication
        id: trunk-auth
        continue-on-error: true
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          if [ -z "$COCOAPODS_TRUNK_TOKEN" ]; then
            echo "::error::COCOAPODS_TRUNK_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions (value: the password field under trunk.cocoapods.org in ~/.netrc of a machine registered via 'pod trunk register')."
            exit 1
          fi
          pod trunk me

      - name: Stamp version into podspec
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Workspace-only change, never committed: the version lives in git tags,
          # exactly like the Android SDK (gradle -Pversion). BSD sed on the macOS runner.
          sed -i '' -E "s/(spec\.version[[:space:]]*=[[:space:]]*)\"[^\"]*\"/\1\"$VERSION\"/" PeekKit.podspec
          grep -Eq "spec\.version[[:space:]]*=[[:space:]]*\"$VERSION\"" PeekKit.podspec || {
            echo "::error::Failed to stamp version $VERSION into PeekKit.podspec"
            exit 1
          }
          git diff PeekKit.podspec

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Must happen BEFORE the trunk push: pod trunk push validates that the
          # tag referenced by spec.source exists and contains the source files.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping"
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Upload the SBOM and the signed XCFramework to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.cert.outputs.signed }}
        run: |
          PUBLISHED=$(gh release view "$VERSION" --json assets --jq '.assets[].name')
          published() { grep -qxF "$1" <<< "$PUBLISHED"; }

          if published PeekKit.cdx.json; then
            echo "PeekKit.cdx.json is already on release $VERSION, keeping it"
          else
            gh release upload "$VERSION" build/xcframework/PeekKit.cdx.json
          fi

          if [ "$SIGNED" != true ]; then
            exit 0
          fi
          if published PeekKit.xcframework.zip && published PeekKit.xcframework.zip.sha256; then
            echo "The XCFramework is already on release $VERSION, keeping the published files"
          elif published PeekKit.xcframework.zip || published PeekKit.xcframework.zip.sha256; then
            echo "::error::Release $VERSION has only one of PeekKit.xcframework.zip and its .sha256. Delete it from the release and re-run, so the two are uploaded together."
            exit 1
          else
            gh release upload "$VERSION" build/xcframework/PeekKit.xcframework.zip build/xcframework/PeekKit.xcframework.zip.sha256
          fi

      - name: Publish to CocoaPods trunk
        id: trunk-push
        if: steps.trunk-auth.outcome == 'success'
        continue-on-error: true
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if curl -sf -m 30 https://trunk.cocoapods.org/api/v1/pods/PeekKit | jq -e --arg v "$VERSION" '.versions[] | select(.name == $v)' >/dev/null; then
            echo "PeekKit $VERSION already exists on CocoaPods trunk, skipping publish"
          else
            pod trunk push PeekKit.podspec --allow-warnings
          fi

      - name: Update CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The stamped podspec is workspace-only; drop it so checking out the latest release cannot clash with it.
          git checkout -q -- PeekKit.podspec
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin release
            git checkout -q -B changelog FETCH_HEAD
            bash scripts/update-changelog.sh "$VERSION" "$RUNNER_TEMP/release-notes.md"
            if git diff --quiet -- CHANGELOG.md; then
              echo "CHANGELOG.md already has $VERSION"
              exit 0
            fi
            git add CHANGELOG.md
            git commit -q -m "chore(release): $VERSION [skip ci]"
            if git push -q origin HEAD:release; then
              echo "CHANGELOG.md updated for $VERSION"
              exit 0
            fi
            echo "release moved while updating CHANGELOG.md, retrying ($attempt/3)"
            sleep 5
          done
          echo "::error::Could not push CHANGELOG.md for $VERSION"
          exit 1

      - name: Wait for CocoaPods CDN
        id: trunk-cdn
        if: steps.trunk-push.outcome == 'success'
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MD5=$(printf '%s' "PeekKit" | md5)
          PREFIX="$(echo "$MD5" | cut -c1)/$(echo "$MD5" | cut -c2)/$(echo "$MD5" | cut -c3)"
          SPEC_URL="https://cdn.cocoapods.org/Specs/$PREFIX/PeekKit/$VERSION/PeekKit.podspec.json"

          for i in $(seq 1 40); do
            if curl -sfL -m 30 "$SPEC_URL" -o /dev/null; then
              echo "::notice::PeekKit $VERSION is live on the CocoaPods CDN: https://cocoapods.org/pods/PeekKit"
              exit 0
            fi
            echo "Waiting for CDN sync (attempt $i/40)..."
            sleep 30
          done

          echo "::error::Trunk push succeeded but the CDN has not served PeekKit $VERSION after 20 minutes. Re-run this workflow to resume (all completed steps skip idempotently), or check https://cocoapods.org/pods/PeekKit"
          exit 1

      - name: Warn when CocoaPods was not updated
        if: steps.trunk-cdn.outcome != 'success'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "::warning::PeekKit $VERSION is not on CocoaPods (trunk login, push or CDN did not succeed). The tag and GitHub release exist, so Swift Package Manager already serves this version. Re-run this workflow to retry CocoaPods."
